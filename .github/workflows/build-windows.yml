name: Build Windows Installer

# Builds the Windows desktop installer (AppBlocker-Setup-<version>.exe) on a
# Windows cloud machine and publishes it to the "windows-latest" release.

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Stamp build number (for the in-app updater)
        working-directory: desktop
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          printf '{"build": %s, "time": "%s", "version": "%s", "exe": "AppBlocker-Setup-%s.exe"}\n' \
            "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VER" "$VER" > src/main/build-info.json
          cp src/main/build-info.json "$GITHUB_WORKSPACE/version.json"
          cat src/main/build-info.json

      - name: Build the installer
        id: build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          npm run dist:win 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Capture log tail (always)
        if: always()
        shell: bash
        run: |
          echo '```' > "$GITHUB_WORKSPACE/build-tail.txt"
          tail -c 6000 "$GITHUB_WORKSPACE/build.log" >> "$GITHUB_WORKSPACE/build-tail.txt" 2>/dev/null || echo "(no log)" >> "$GITHUB_WORKSPACE/build-tail.txt"
          echo '```' >> "$GITHUB_WORKSPACE/build-tail.txt"

      - name: Publish installer to "windows-latest" release (on success)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Windows installer (latest)
          prerelease: true
          files: |
            desktop/dist/*.exe
            version.json

      - name: Publish build log to "windows-ci-log" (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-ci-log
          name: Windows CI build log
          prerelease: true
          body_path: build-tail.txt
